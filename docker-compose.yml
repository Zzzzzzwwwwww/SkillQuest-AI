# ==================== SkillQuest AI 编排文件 ====================
# 一键启动：docker compose up -d --build
# 服务清单：mysql:8 / redis:7 / backend / frontend

version: "3.9"

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: skillquest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-skillquest}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skillquest}
      MYSQL_USER: ${MYSQL_USER:-skillquest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skillquest}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-skillquest}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - skillquest-net

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: skillquest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - skillquest-net

  # ---------- PgVector（知识库向量检索，预留） ----------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: skillquest-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-skillquest}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-skillquest}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-skillquest_vector}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-skillquest} -d ${PGVECTOR_DATABASE:-skillquest_vector}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - skillquest-net

  # ---------- 后端 FastAPI ----------
  backend:
    build: ./backend
    container_name: skillquest-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      PGVECTOR_HOST: pgvector
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ORIGINS: http://localhost:80,http://127.0.0.1:80
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skillquest-net

  # ---------- 前端 Vue3 + Nginx ----------
  frontend:
    build: ./frontend
    container_name: skillquest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skillquest-net

# ---------- 持久化卷 ----------
volumes:
  mysql_data:
  redis_data:
  pgvector_data:

# ---------- 网络 ----------
networks:
  skillquest-net:
    driver: bridge